[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ningsi-capture"
version = "0.4.2"
description = "Independent EEG research recorder with tasks, thought probes and training exports"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pylsl==1.18.2"]

[project.scripts]
ningsi-capture = "ningsi_capture.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
